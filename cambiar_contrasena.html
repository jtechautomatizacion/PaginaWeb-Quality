<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cambiar Contraseña | Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon-32.png?v=103" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon-180.png?v=103">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .card-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 12px;
            text-align: center;
        }
        .card-subtitle {
            font-size: 14px;
            color: #6B7280;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-control {
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-change {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn-change:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-change:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            border-radius: 8px;
            border: none;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .alert-danger {
            background-color: #FEE2E2;
            color: #991B1B;
        }
        .alert-success {
            background-color: #DCFCE7;
            color: #166534;
        }
        .password-strength {
            font-size: 12px;
            margin-top: 6px;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }
        .strength-weak { background: #FEE2E2; color: #991B1B; display: block; }
        .strength-good { background: #FEF3C7; color: #92400E; display: block; }
        .strength-strong { background: #DCFCE7; color: #166534; display: block; }
    </style>
    <script src="js/api-base.js?v=103"></script>
</head>
<body>
    <div class="card-container">
        <div class="card-title"><i class="fas fa-lock-alt" style="margin-right: 8px;"></i> Cambiar Contraseña</div>
        <div class="card-subtitle">Debes cambiar tu contraseña antes de acceder al panel</div>

        <form id="changeForm">
            <div id="alertContainer"></div>

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" class="form-control" id="username" placeholder="admin" required>
            </div>

            <div class="form-group">
                <label for="oldPassword">Contraseña Actual</label>
                <input type="password" class="form-control" id="oldPassword" placeholder="••••••" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" class="form-control" id="newPassword" placeholder="••••••" required>
                <div class="password-strength" id="strengthMeter"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••" required>
            </div>

            <button type="submit" class="btn-change" id="submitBtn">Cambiar Contraseña</button>
        </form>
    </div>

    <script>
        const newPassInput = document.getElementById('newPassword');
        const strengthMeter = document.getElementById('strengthMeter');

        newPassInput.addEventListener('input', function() {
            const len = this.value.length;
            if (len < 6) {
                strengthMeter.className = 'password-strength strength-weak';
                strengthMeter.textContent = '❌ Mínimo 6 caracteres';
            } else if (len < 10) {
                strengthMeter.className = 'password-strength strength-good';
                strengthMeter.textContent = '⚠️ Contraseña débil';
            } else {
                strengthMeter.className = 'password-strength strength-strong';
                strengthMeter.textContent = '✓ Contraseña fuerte';
            }
        });

        document.getElementById('changeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertContainer = document.getElementById('alertContainer');
            const submitBtn = document.getElementById('submitBtn');

            alertContainer.innerHTML = '';

            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Las contraseñas no coinciden.</div>';
                return;
            }

            if (newPassword.length < 6) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> La contraseña debe tener al menos 6 caracteres.</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            try {
                const response = await fetch(window.API_BASE + '/api/cambiar_contrasena', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    alertContainer.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> ' + data.message + ' Redirigiendo...</div>';
                    setTimeout(() => window.location.href = data.redirect, 1500);
                } else {
                    alertContainer.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ' + data.message + '</div>';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Cambiar Contraseña';
                }
            } catch (error) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Error: ' + error.message + '</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Cambiar Contraseña';
            }
        });
    </script>
</body>
</html>
